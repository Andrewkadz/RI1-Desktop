[workspace]
members = ["crates/ri1-audio", "crates/ri1-cli", "crates/ri1-code",
    "crates/ri1-core", "crates/ri1-image", "crates/ri1-signal", "crates/ri1-symbolic", "crates/ri1-symbolic-meta", "crates/ri1-text",
]
resolver = "2"

[workspace.package]
edition = "2021"
authors = ["RI1 Contributors"]
license = "Apache-2.0"

[package]
name = "ri1-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ri1_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.7"
regex = "1"

