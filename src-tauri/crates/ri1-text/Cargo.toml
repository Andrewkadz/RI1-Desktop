[package]
name = "ri1-text"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
ri1-core = { path = "../ri1-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
